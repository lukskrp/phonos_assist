name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        # ubuntu-latest already ships the SDK and sdkmanager, so no
        # third-party setup action is needed (android-actions/setup-android
        # is currently broken: it asks sdkmanager for the obsolete 'tools'
        # package, which fails with exit code 1).
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
