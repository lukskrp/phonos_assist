name: Release

# Publishes a signed release APK as a GitHub Release asset.
# Trigger: push a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of the release keystore (never commit it)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias (e.g. phonosassist)
#   KEY_PASSWORD       key password

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$SDKROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Restore release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/phonosassist-release.jks"

      - name: Build signed release APK
        run: ./gradlew assembleRelease -x lint --stacktrace
        env:
          PHONOSASSIST_STORE_FILE: ${{ runner.temp }}/phonosassist-release.jks
          PHONOSASSIST_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PHONOSASSIST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PHONOSASSIST_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDKROOT/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
